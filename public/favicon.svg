<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="GYM and FOOD">
  <defs>
    <linearGradient id="bg" x1="10" y1="4" x2="118" y2="124" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffc48f"/>
      <stop offset="45%" stop-color="#ff5c35"/>
      <stop offset="100%" stop-color="#c41f08"/>
    </linearGradient>
    <radialGradient id="glow" cx="30%" cy="20%" r="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".45"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity=".1"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="leafBg" x1="84" y1="84" x2="118" y2="118" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3dd4a0"/>
      <stop offset="100%" stop-color="#0a3a2f"/>
    </linearGradient>
    <filter id="soft" x="-35%" y="-35%" width="170%" height="170%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#5a1002" flood-opacity=".32"/>
    </filter>
  </defs>

  <rect width="128" height="128" rx="30" fill="url(#bg)"/>
  <rect width="128" height="128" rx="30" fill="url(#glow)"/>
  <rect x="7.5" y="7.5" width="113" height="113" rx="24.5" fill="none" stroke="#ffffff" stroke-opacity=".18" stroke-width="1.8"/>

  <g filter="url(#soft)" transform="translate(64 55) rotate(-40)" fill="#fffefb">
    <!-- dumbbell plates -->
    <rect x="-52" y="-23" width="13" height="46" rx="6.5"/>
    <rect x="-37" y="-17" width="11" height="34" rx="5.5"/>
    <rect x="-24" y="-11" width="9" height="22" rx="4.5"/>
    <!-- shaft -->
    <rect x="-15" y="-5.5" width="38" height="11" rx="5.5"/>
    <!-- fork neck -->
    <rect x="21" y="-7" width="12" height="14" rx="5"/>
    <!-- fork head base -->
    <rect x="30" y="-10" width="28" height="20" rx="6"/>
    <!-- four tines -->
    <rect x="31.5" y="-32" width="5.2" height="24" rx="2.6"/>
    <rect x="39.1" y="-34" width="5.2" height="26" rx="2.6"/>
    <rect x="46.7" y="-34" width="5.2" height="26" rx="2.6"/>
    <rect x="54.3" y="-32" width="5.2" height="24" rx="2.6"/>
  </g>

  <circle cx="98" cy="98" r="21.5" fill="url(#leafBg)"/>
  <circle cx="98" cy="98" r="21.5" fill="none" stroke="#fffefb" stroke-width="3.2"/>
  <path d="M89.2 103.8c10.4-16 22.6-20.6 29-20.8-2.1 12-9.4 23.2-22 27.6-4.8-2-7.2-4.5-7-6.8z" fill="#fffefb"/>
  <path d="M97.2 100.6c7.6-4.8 15-7.4 20-8.4" fill="none" stroke="#0a3a2f" stroke-width="2.1" stroke-linecap="round"/>
</svg>
